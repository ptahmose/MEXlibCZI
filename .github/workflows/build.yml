name: Build for Ubuntu-x64, Windows-x64 and macOS-arm64

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Should a release be created?"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
  push: 

permissions:
  contents: read

jobs:
  build:
    name: Build Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Keep older Ubuntu builds for compatibility alongside the current LTS.
        os: [ubuntu-26.04, ubuntu-24.04, ubuntu-22.04, windows-latest, macos-15]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python for release materials
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test release tooling
        shell: bash
        run: |
          python -m pip install -r compliance/requirements-validation.txt
          python -m unittest discover -s tests/release_materials -v
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
      - name: run build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DMEXLIBCZI_BUILD_HELPER_TESTS=ON
          cmake --build . --config Release -j
      - name: run build (macOS Apple Silicon)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          test "$(uname -m)" = "arm64"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMEXLIBCZI_BUILD_HELPER_TESTS=ON -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          cmake --build build --config Release --parallel 3
      - name: run build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DMEXLIBCZI_BUILD_HELPER_TESTS=ON
          cmake --build . --config Release -j
      - name: Run native unit tests
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error
      - name: Prepare MATLAB unit tests
        shell: bash
        run: |
          # if on Windows, then this is the mex-file we need to copy to the tests/MATLAB folder
          if [ -f "build/MEXlibCZI/Release/MEXlibCZI.mexw64" ]; then
            cp "build/MEXlibCZI/Release/MEXlibCZI.mexw64" tests/MATLAB/
          fi
          if [ -f "build/MEXlibCZI/MEXlibCZI.mexa64" ]; then
            cp "build/MEXlibCZI/MEXlibCZI.mexa64" tests/MATLAB/
          fi
          if [ -f "build/MEXlibCZI/MEXlibCZI.mexmaca64" ]; then
            cp "build/MEXlibCZI/MEXlibCZI.mexmaca64" tests/MATLAB/
          fi
      - name: Run MATLAB unit tests
        uses: matlab-actions/run-command@v3
        with:
          command: cd tests/MATLAB; results = runtests, assertSuccess(results);
      - name: Prepare MATLAB artifact (macOS Apple Silicon)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          name="MATLAB-MEXlibCZI-macos15_arm64-$(git describe --always)"
          mkdir -p "artifacts/${name}"
          cp build/MEXlibCZI/MEXlibCZI.mexmaca64 "artifacts/${name}/"
          file "artifacts/${name}/MEXlibCZI.mexmaca64"
          otool -L "artifacts/${name}/MEXlibCZI.mexmaca64"
          echo "artifactName=${name}" >> "$GITHUB_ENV"
          echo "artifactPath=artifacts/${name}" >> "$GITHUB_ENV"
      - name: Prepare MATLAB artifact (Linux Ubuntu26)
        id: prepare_linux_ubuntu26_matlab_artifact
        if: matrix.os == 'ubuntu-26.04'
        shell: bash
        run: |
          mkdir -p artifacts
          name="MATLAB-MEXlibCZI-linux-ubuntu26_x64-$(git describe --always)"
          mkdir -p artifacts/${name}
          cp build/MEXlibCZI/MEXlibCZI.mexa64 artifacts/${name}/
          echo "artifactName=${name}" >> "$GITHUB_ENV"
          echo "artifactPath=artifacts/${name}" >> "$GITHUB_ENV"
          echo "linuxx64_ubuntu26_matlab_build=${name}" >> "$GITHUB_OUTPUT"
      - name: Prepare MATLAB artifact (Linux Ubuntu24)
        id: prepare_linux_ubuntu24_matlab_artifact
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          mkdir -p artifacts
          name="MATLAB-MEXlibCZI-linux-ubuntu24_x64-$(git describe --always)"
          mkdir -p artifacts/${name}
          cp build/MEXlibCZI/MEXlibCZI.mexa64 artifacts/${name}/
          echo "artifactName=${name}" >> "$GITHUB_ENV"
          echo "artifactPath=artifacts/${name}" >> "$GITHUB_ENV"
          echo "linuxx64_ubuntu24_matlab_build=${name}" >> "$GITHUB_OUTPUT"
      - name: Prepare MATLAB artifact (Linux Ubuntu22)
        id: prepare_linux_ubuntu22_matlab_artifact
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          mkdir -p artifacts
          name="MATLAB-MEXlibCZI-linux-ubuntu22_x64-$(git describe --always)"
          mkdir -p artifacts/${name}
          cp build/MEXlibCZI/MEXlibCZI.mexa64 artifacts/${name}/
          echo "artifactName=${name}" >> "$GITHUB_ENV"
          echo "artifactPath=artifacts/${name}" >> "$GITHUB_ENV"
          echo "linuxx64_ubuntu22_matlab_build=${name}" >> "$GITHUB_OUTPUT"
      - name: install Octave (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install octave --no-progress
          # I am not sure how to find the octave-cli-executable now, so we search for the link in the start menu
          search_dir="/c/ProgramData/Microsoft/Windows/Start Menu/Programs"
          octave_link=$(find "$search_dir" -type f -name "Octave*CLI*.lnk" 2>/dev/null)
          octave_link_windows_path=$(cygpath -w "$octave_link")
          echo "octave_link=$octave_link"
          echo "octave_link_windows_path=$octave_link_windows_path"
          echo "OCTAVECLI_LINK=$octave_link_windows_path" >> "$GITHUB_ENV"
      - name: install Octave (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # the name of the "dev package" has changed as of Ubuntu 24.04
          # Extract Ubuntu version from /etc/os-release
          ubuntu_version=$(grep VERSION_ID /etc/os-release | cut -d '"' -f 2)
          # Compare the version to 24.04 using dpkg --compare-versions
          if dpkg --compare-versions "$ubuntu_version" ge "24.04"; then
            octave_dev_package="octave-dev"
          else
            octave_dev_package="liboctave-dev"
          fi
          sudo apt-get install -y -qq -o=Dpkg::Progress-Fancy="0" octave $octave_dev_package
      - name: install Octave (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: brew install octave
      - name: build Octave mex-file (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd OctaveMex
          octave --version
          mkoctfile --mex octavelibczi.c
          octave --quiet --eval "fid=fopen('../build/octave-version.txt','w'); assert(fid>=0); fprintf(fid,'%s',version); fclose(fid);"
          cp ../build/libmexlibczi/libmexlibczi.dylib .
          file octavelibczi.mex libmexlibczi.dylib
          otool -L octavelibczi.mex libmexlibczi.dylib
      - name: build Octave mex-file (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          REM We compile the mex file for Octave within Octave itself, this seems the easiest way. The
          REM downside is that installing octave takes a long time.
          REM Note that we are using cmd.exe here, because it can "execute" the .lnk file.
          "%OCTAVECLI_LINK%" --version
          REM echo "cd %GITHUB_WORKSPACE%/OctaveMex ,  mkoctfile --mex octavelibczi.c"
          set GITHUB_WORKSPACE_FORWARD_SLASHES=%GITHUB_WORKSPACE:\=/%
          "%OCTAVECLI_LINK%" --eval "cd %GITHUB_WORKSPACE_FORWARD_SLASHES%/OctaveMex , mkoctfile --mex octavelibczi.c"
          "%OCTAVECLI_LINK%" --eval "fid=fopen('%GITHUB_WORKSPACE_FORWARD_SLASHES%/build/octave-version.txt','w'); assert(fid>=0); fprintf(fid,'%s',version); fclose(fid);"
          REM now, copy the libmexlibczi.dll to this folder
          copy /B build\libmexlibczi\Release\libmexlibczi.dll %GITHUB_WORKSPACE%\OctaveMex
          echo "*** directory listing of %GITHUB_WORKSPACE%\OctaveMex ***"
          dir %GITHUB_WORKSPACE%\OctaveMex
      - name: build Octave mex-file (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd OctaveMex
          # Get the version of Octave
          octave_version=$(octave --version | head -n 1 | awk '{print $NF}')
          echo "Detected Octave version: $octave_version"
          # Define the version to compare against - for versions <= 6.4.0, we want to define "OCTAVEMEX_NO_GET_TYPED" in order to not use functions not available in older versions
          max_version="6.4.0"
          # Compare versions
          if [[ "$(printf '%s\n' "$octave_version" "$max_version" | sort -V | head -n 1)" == "$octave_version" ]]; then
              echo "Octave version is less than or equal to $max_version"
              octave --eval "mkoctfile --mex octavelibczi.c -DOCTAVEMEX_NO_GET_TYPED"
          else
              echo "Octave version is greater than $max_version"
              octave --eval "mkoctfile --mex octavelibczi.c"
          fi
          octave --quiet --eval "fid=fopen('../build/octave-version.txt','w'); assert(fid>=0); fprintf(fid,'%s',version); fclose(fid);"
          cp ../build/libmexlibczi/libmexlibczi.so .  # now, copy the libmexlibczi.so to this folder
      - name: Octave Unit-Tests (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd tests/octave
          # Note: Unfortunately, if using 'test' in functional form, there is no way to get the "test-result output" in the console it seems.
          #       c.f. https://docs.octave.org/interpreter/Test-Functions.html
          octave --eval "addpath('../../OctaveMex'),if test('test_basic_operation.m'), exit(0); else, exit(1); end"
          octave --eval "addpath('../../OctaveMex'),if test('test_write.m'), exit(0); else, exit(1); end"
          octave --eval "addpath('../../OctaveMex'),if test('test_querysubblockdirectory.m'), exit(0); else, exit(1); end"
          octave --eval "addpath('../../OctaveMex'),if test('test_argument_validation.m'), exit(0); else, exit(1); end"
      - name: Octave Unit-Tests (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cd tests/octave
          set GITHUB_WORKSPACE_FORWARD_SLASHES=%GITHUB_WORKSPACE:\=/%
          "%OCTAVECLI_LINK%" --eval "cd %GITHUB_WORKSPACE_FORWARD_SLASHES%/tests/octave,addpath('../../OctaveMex'),if test('test_basic_operation.m'), exit(0); else, exit(1); end"
          "%OCTAVECLI_LINK%" --eval "cd %GITHUB_WORKSPACE_FORWARD_SLASHES%/tests/octave,addpath('../../OctaveMex'),if test('test_write.m'), exit(0); else, exit(1); end"
          "%OCTAVECLI_LINK%" --eval "cd %GITHUB_WORKSPACE_FORWARD_SLASHES%/tests/octave,addpath('../../OctaveMex'),if test('test_querysubblockdirectory.m'), exit(0); else, exit(1); end"
          "%OCTAVECLI_LINK%" --eval "cd %GITHUB_WORKSPACE_FORWARD_SLASHES%/tests/octave,addpath('../../OctaveMex'),if test('test_argument_validation.m'), exit(0); else, exit(1); end"
      - name: Prepare MATLAB-mex artifact (Windows)
        id: prepare_windows_matlab_artifact
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p artifacts
          name="MATLAB-MEXlibCZI-windows-x64-$(git describe --always)"
          mkdir -p "artifacts/${name}"
          cp "build/MEXlibCZI/Release/MEXlibCZI.mexw64" "artifacts/${name}/"
          echo "artifactName=${name}" >> "$GITHUB_ENV"
          echo "artifactPath=artifacts/${name}" >> "$GITHUB_ENV"
          echo "windowsx64_matlab_build=${name}" >> "$GITHUB_OUTPUT"
      - name: Prepare licenses and project/dependency source bundle
        shell: bash
        run: python scripts/release_materials.py prepare --build build --output build/release-materials --platform "${{ matrix.os }}"
      - name: Add MATLAB license materials and SBOM
        shell: bash
        run: |
          python scripts/release_materials.py package --materials build/release-materials --package "${artifactPath}" --host matlab
          python scripts/validate_sbom.py "${artifactPath}/sbom.cdx.json"
      - name: Verify source bundle configures offline (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p build/source-check
          tar -xzf build/release-materials/MEXlibCZI-source-*.tar.gz -C build/source-check
          python build/source-check/MEXlibCZI-source-*/rebuild.py
      - name: Upload MATLAB-mex artifacts
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.artifactPath }}/
          name: ${{ env.artifactName }}
      - name: Prepare Octave-mex artifact (macOS Apple Silicon)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          name="Octave-MEXlibCZI-macos15_arm64-$(git describe --always)"
          mkdir -p "artifacts/${name}"
          cp OctaveMex/libmexlibczi.dylib OctaveMex/octavelibczi.mex "artifacts/${name}/"
          echo "artifactName=${name}" >> "$GITHUB_ENV"
          echo "artifactPath=artifacts/${name}" >> "$GITHUB_ENV"
      - name: Prepare Octave-mex artifact (Windows)
        id: prepare_windows_octave_artifact
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p artifacts
          name="Octave-MEXlibCZI-windows-x64-$(git describe --always)"
          mkdir -p "artifacts/${name}"
          cp $(cygpath "${GITHUB_WORKSPACE}")/OctaveMex/libmexlibczi.dll "artifacts/${name}/"
          cp $(cygpath "${GITHUB_WORKSPACE}")/OctaveMex/octavelibczi.mex "artifacts/${name}/"
          echo "artifactName=${name}" >> "$GITHUB_ENV"
          echo "artifactPath=artifacts/${name}" >> "$GITHUB_ENV"
          echo "windowsx64_octave_build=${name}" >> "$GITHUB_OUTPUT"
      - name: Prepare Octave-mex artifact (Linux Ubuntu26)
        id: prepare_linux_ubuntu26_octave_artifact
        if: matrix.os == 'ubuntu-26.04'
        shell: bash
        run: |
          mkdir -p artifacts
          name="Octave-MEXlibCZI-linux-ubuntu26_x64-$(git describe --always)"
          mkdir -p "artifacts/${name}"
          cp "${GITHUB_WORKSPACE}/OctaveMex/libmexlibczi.so" "artifacts/${name}/"
          cp "${GITHUB_WORKSPACE}/OctaveMex/octavelibczi.mex" "artifacts/${name}/"
          echo "artifactName=${name}" >> "$GITHUB_ENV"
          echo "artifactPath=artifacts/${name}" >> "$GITHUB_ENV"
          echo "linuxx64_ubuntu26_octave_build=${name}" >> "$GITHUB_OUTPUT"
      - name: Prepare Octave-mex artifact (Linux Ubuntu24)
        id: prepare_linux_ubuntu24_octave_artifact
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          mkdir -p artifacts
          name="Octave-MEXlibCZI-linux-ubuntu24_x64-$(git describe --always)"
          mkdir -p "artifacts/${name}"
          cp "${GITHUB_WORKSPACE}/OctaveMex/libmexlibczi.so" "artifacts/${name}/"
          cp "${GITHUB_WORKSPACE}/OctaveMex/octavelibczi.mex" "artifacts/${name}/"
          echo "artifactName=${name}" >> "$GITHUB_ENV"
          echo "artifactPath=artifacts/${name}" >> "$GITHUB_ENV"
          echo "linuxx64_ubuntu24_octave_build=${name}" >> "$GITHUB_OUTPUT"
      - name: Prepare Octave-mex artifact (Linux Ubuntu22)
        id: prepare_linux_ubuntu22_octave_artifact
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          mkdir -p artifacts
          name="Octave-MEXlibCZI-linux-ubuntu22_x64-$(git describe --always)"
          mkdir -p "artifacts/${name}"
          cp "${GITHUB_WORKSPACE}/OctaveMex/libmexlibczi.so" "artifacts/${name}/"
          cp "${GITHUB_WORKSPACE}/OctaveMex/octavelibczi.mex" "artifacts/${name}/"
          echo "artifactName=${name}" >> "$GITHUB_ENV"
          echo "artifactPath=artifacts/${name}" >> "$GITHUB_ENV"
          echo "linuxx64_ubuntu22_octave_build=${name}" >> "$GITHUB_OUTPUT"
      - name: Add Octave license materials and SBOM
        shell: bash
        run: |
          python scripts/release_materials.py package --materials build/release-materials --package "${artifactPath}" --host octave
          python scripts/validate_sbom.py "${artifactPath}/sbom.cdx.json"
      - name: Upload project/dependency sources
        uses: actions/upload-artifact@v7
        with:
          name: source-${{ matrix.os }}
          path: build/release-materials/MEXlibCZI-source-*.tar.gz
          if-no-files-found: error
      - name: Upload Octave-mex artifacts
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.artifactPath }}/
          name: ${{ env.artifactName }}

  verify_release:
    name: Verify release package set
    runs-on: ubuntu-latest
    needs: build
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Validate and assemble release materials
        shell: bash
        run: |
          python -m pip install -r compliance/requirements-validation.txt
          python scripts/validate_sbom.py artifacts/MATLAB-*/sbom.cdx.json artifacts/Octave-*/sbom.cdx.json
          python scripts/release_materials.py assemble --artifacts artifacts --output release-dist
      - name: Record release version
        id: version
        shell: bash
        run: |
          cd scripts
          echo "version=$(bash get_version.sh)" >> "$GITHUB_OUTPUT"
      - name: Upload verified release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: release-dist/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: verify_release
    if: inputs.create_release == 'true' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@v5
      - name: Refuse to overwrite an existing release tag
        env:
          RELEASE_VERSION: ${{ needs.verify_release.outputs.version }}
        shell: bash
        run: |
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/v${RELEASE_VERSION}"
          result=$?
          set -e
          if [ "$result" -eq 0 ]; then
            echo "::error::Release tag already exists. Bump the version before publishing."
            exit 1
          elif [ "$result" -ne 2 ]; then
            exit "$result"
          fi
      - name: Download verified release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-dist
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: version ${{ needs.verify_release.outputs.version }}
          tag_name: v${{ needs.verify_release.outputs.version }}
          files: |
            release-dist/*
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          prerelease: true
